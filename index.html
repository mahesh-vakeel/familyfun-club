* { box-sizing: border-box; }
html, body { margin: 0; }

button { font: inherit; cursor: pointer; color: inherit; }

.clue .text { font-family: var(--display); font-size: 1.35rem; font-weight: 700; }

.options { display: grid; gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; text-align: left; font-weight: 700; font-size: 1.05rem; }
.opt:hover:not(:disabled) { border-color: var(--marigold); }
.opt.picked { border-color: var(--marigold); background: color-mix(in srgb, var(--marigold) 22%, var(--surface)); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }

.feedback { text-align: center; font-family: var(--display); font-size: 1.4rem; font-weight: 700; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--bad); }

.mode { border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 10px 12px; text-align: left; display: flex; gap: 12px; align-items: center; }

:root { --vote: color-mix(in srgb, var(--marigold) 28%, transparent); }

// ---------- More games ----------
const TRUE_FALSE = [
  ["An octopus has three hearts.", true], ["Honey can stay good to eat for thousands of years.", true],
  ["The Great Wall of China is easy to see from the Moon.", false], ["A group of flamingos is called a flamboyance.", true],

];
const LIKELY = [

  "cry while watching a film", "win a dance competition", "lose their phone while holding it", "become famous",

  "win at antakshari", "stay up the latest", "talk the longest on a phone call", "forget a birthday", "win a game show"
];
const MODES = {
  guess:  { name: "Guess it", icon: "🎬", blurb: "Movie, place or animal from emoji clues", seconds: 20 },
  quiz:   { name: "Quiz", icon: "🧠", blurb: "9 topics, easy to hard. Pick a topic and level", seconds: 20 },
  funny:  { name: "Funny answers", icon: "😂", blurb: "Everyone writes a funny answer, then votes for the best one", seconds: 45, voteSeconds: 25 },

  likely: { name: "Who's most likely to…", icon: "🙋", blurb: "Vote for a family member. Agree with the family to score", seconds: 20 },
  tf:     { name: "True or false", icon: "⚡", blurb: "Quick-fire facts. Fastest correct answers get bonus points", seconds: 10 },
  riddle: { name: "Riddles", icon: "🧩", blurb: "Type your answer. Small spelling mistakes are fine", seconds: 30 }
};
const LEVELS = { mixed: "Mixed", easy: "Easy", medium: "Medium", hard: "Hard" };
const CATS = ["mixed", "movies", "places", "animals"];
const AVATARS = ["😀", "👵", "👴", "👩", "👨", "👧", "👦", "🧒", "🐯", "🦊", "🐼", "🦄"];

// ---------- Helpers ----------
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\b(a|an|the)\b/g, "").replace(/\s+/g, " ").trim();
function close(a, b) {   // allow one typo in longer words
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1 || b.length < 5) return false;
  if (a.length === b.length) {   // two neighbouring letters swapped, e.g. "candel"
    const d = [...a].map((c, i) => c !== b[i] ? i : -1).filter(i => i >= 0);
    if (d.length === 2 && d[1] === d[0] + 1 && a[d[0]] === b[d[1]] && a[d[1]] === b[d[0]]) return true;
  }
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}
function newCode() {
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = ""; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)];

}

// Each question: { kind: "choice" | "text" | "vote" | "funny", icon, label, clue, ask, text, options?, who? } plus a secret answer list.
function buildQuestions(g, players) {
  const count = g.count;
  if (g.mode === "quiz") {
    const topics = g.topic === "mixed" ? Object.keys(QUIZ) : [g.topic];
    const levels = g.level === "mixed" ? ["easy", "medium", "hard"] : [g.level];
    const pool = shuffle(topics.flatMap(t => levels.flatMap(l => QUIZ[t][l].map(row => ({ t, l, row })))));
    return pool.slice(0, count).map(({ t, l, row }) => ({
      q: { kind: "choice", icon: QUIZ[t].icon, label: `${QUIZ[t].name} · ${LEVELS[l]}`, clue: row[0], ask: "Pick the right answer", text: true, options: shuffle(row.slice(1)) },
      answers: [row[1]]
    }));
  }
  if (g.mode === "tf") {
    return shuffle(TRUE_FALSE).slice(0, count).map(([fact, yes]) =>
      ({ q: { kind: "choice", icon: "⚡", label: "True or false", clue: fact, ask: "True or false?", text: true, options: ["True", "False"] }, answers: [yes ? "True" : "False"] }));
  }
  if (g.mode === "riddle") {
    return shuffle(RIDDLES).slice(0, count).map(([riddle, answers]) =>
      ({ q: { kind: "text", icon: "🧩", label: "Riddle", clue: riddle, ask: "Type your answer", text: true }, answers }));
  }
  if (g.mode === "likely") {
    const options = players.map(p => p.id);
    return shuffle(LIKELY).slice(0, count).map(thing =>
      ({ q: { kind: "vote", who: true, icon: "🙋", label: "Family vote", clue: `Who is most likely to ${thing}?`, ask: "Vote for one person", text: true, options }, answers: [] }));
  }
  if (g.mode === "rather") {
    return shuffle(WOULD_RATHER).slice(0, count).map(([a, b]) =>
      ({ q: { kind: "vote", icon: "🤔", label: "Would you rather", clue: "Would you rather…", ask: "Most popular choice scores", text: true, options: [a, b] }, answers: [] }));
  }
  if (g.mode === "funny") {
    return shuffle(FUNNY_PROMPTS).slice(0, count).map(prompt =>
      ({ q: { kind: "funny", icon: "😂", label: "Funny answers", clue: prompt, ask: "Write your funniest answer", text: true }, answers: [] }));
  }
  const cats = g.cat === "mixed" ? ["movies", "places", "animals"] : [g.cat];
  const pool = shuffle(cats.flatMap(c => BANK[c].items.map(([clue, answer]) => ({ c, clue, answer }))));
  return pool.slice(0, count).map(({ c, clue, answer }) => {
    const others = shuffle(BANK[c].items.map(x => x[1]).filter(a => a !== answer)).slice(0, 3);
    return { q: { kind: "choice", icon: BANK[c].icon, label: BANK[c].name, clue, ask: BANK[c].ask, text: c === "animals", options: shuffle([answer, ...others]) }, answers: [answer] };
  });
}

try {
  const fb = initializeApp(firebaseConfig);
  db = getFirestore(fb); auth = getAuth(fb);
} catch (e) {
  app.innerHTML = `<section class="panel"><h2>Setup needed</h2><p>Add your Firebase settings at the top of index.html.</p></section>`;
  throw e;
}
onAuthStateChanged(auth, user => { if (user) { S.uid = user.uid; render(); } });
signInAnonymously(auth).catch(e => {
  app.innerHTML = `<section class="panel"><h2>Can't connect</h2><p class="err">${esc(e.message)}</p>
  <p class="note">Check your internet connection and reload the page.</p></section>`;
});

const gameRef = code => doc(db, "games", code);
const isHost = () => S.game && S.game.hostUid === S.uid;
const me = () => S.players.find(p => p.id === S.uid);
const playerName = id => S.players.find(p => p.id === id)?.name || "Someone";
// Every answering phase has its own key, so an answer for one question or phase never counts for another.
const phaseKey = g => `${g.qIndex}:${g.status}`;
const answerOf = (p, g) => (p?.answer && p.answer.k === phaseKey(g)) ? p.answer.pick : null;

// ---------- Game actions ----------
async function hostGame() {
  if (!saveProfile()) return;
  let code = newCode();
  for (let i = 0; i < 5 && (await getDoc(gameRef(code))).exists(); i++) code = newCode();
  await setDoc(gameRef(code), {
    hostUid: S.uid, status: "lobby", mode: S.mode, cat: S.cat, topic: S.topic, level: S.level, count: S.count,
    total: 0, qIndex: -1, questions: [], voteOptions: [], reveal: null, deadline: 0, span: 0, closing: false, createdAt: serverTimestamp()
  });
  await joinGame(code);
}

async function joinGame(code) {
  if (!saveProfile()) return;
  code = (code || "").toUpperCase().trim();
  const snap = await getDoc(gameRef(code));
  if (!snap.exists()) { S.error = `No game found with code ${code}. Check the code and try again.`; render(); return; }
  const pRef = doc(db, "games", code, "players", S.uid);
  const existing = await getDoc(pRef);
  if (existing.exists()) await updateDoc(pRef, { name: S.name, avatar: S.avatar });
  else await setDoc(pRef, { name: S.name, avatar: S.avatar, score: 0, correct: 0, answer: null, joinedAt: serverTimestamp() });
  S.code = code; S.error = "";
  history.replaceState(null, "", "?game=" + code);
  watch(code);
}

function watch(code) {
  S.unsub.forEach(u => u()); S.unsub = [];
  S.unsub.push(onSnapshot(gameRef(code), s => {
    const prev = S.game; S.game = s.data();
    if (!prev || prev.qIndex !== S.game.qIndex || prev.status !== S.game.status) S.editing = false;
    render(); hostCheck();
  }));
  S.unsub.push(onSnapshot(collection(db, "games", code, "players"), s => {
    S.players = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render(); hostCheck();
  }));
  clearInterval(S.tick);
  S.tick = setInterval(() => { updateTimer(); hostCheck(); }, 250);
}

async function startGame() {
  const g = S.game;
  const built = buildQuestions(g, S.players);
  // Firestore cannot store lists inside lists, so answers are kept as a map by question number.
  await setDoc(doc(db, "games", S.code, "secret", "key"), { answers: Object.fromEntries(built.map((b, i) => [String(i), b.answers])) });
  await updateDoc(gameRef(S.code), { questions: built.map(b => b.q), total: built.length });
  S.game = { ...g, questions: built.map(b => b.q), total: built.length };
  await startNext();
}

async function startNext() {
  const g = S.game, next = g.qIndex + 1;
  if (next >= g.total) { await updateDoc(gameRef(S.code), { status: "done" }); return; }
  const span = MODES[g.mode].seconds * 1000;
  await updateDoc(gameRef(S.code), { status: "question", qIndex: next, reveal: null, voteOptions: [], closing: false, span, deadline: Date.now() + span });
}

// Answers live on the player's own record and can be changed until the question closes.
async function pick(option) {
  const g = S.game;
  option = String(option ?? "").trim().slice(0, 80);
  if (!option || !["question", "vote"].includes(g.status) || Date.now() >= g.deadline) return;
  S.editing = false;
  if (g.questions[g.qIndex].kind === "funny" && g.status === "question") S.ownFunny = { q: g.qIndex, text: option };
  const mine = me();
  if (mine) { mine.answer = { k: phaseKey(g), pick: option }; render(); }
  await updateDoc(doc(db, "games", S.code, "players", S.uid), { answer: { k: phaseKey(g), pick: option, at: serverTimestamp() } });
}

// The host's phone closes each question when time is up (or shortly after everyone has answered) and scores it.
async function hostCheck() {
  const g = S.game;
  if (!isHost() || !g || !["question", "vote"].includes(g.status) || S.busy) return;
  const key = phaseKey(g);
  const allIn = S.players.length > 0 && S.players.every(p => p.answer?.k === key);
  S.busy = true;
  try {
    if (Date.now() < g.deadline) {
      if (allIn && !g.closing && g.deadline - Date.now() > LAST_CALL_MS) {
        await updateDoc(gameRef(S.code), { closing: true, deadline: Date.now() + LAST_CALL_MS });
      }
      return;
    }
    const qi = g.qIndex, q = g.questions[qi];
    const ans = S.players.filter(p => p.answer?.k === key)
      .map(p => ({ uid: p.id, pick: p.answer.pick, at: p.answer.at?.toMillis?.() || 0 }))
      .sort((a, b) => a.at - b.at);
    const picks = Object.fromEntries(ans.map(a => [a.uid, a.pick]));
    const points = {};
    let reveal;

    if (q.kind === "funny" && g.status === "question") {
      // Writing time is over: shuffle the answers and open voting.
      const entries = shuffle(ans.filter(a => a.pick));
      if (entries.length >= 2) {
        await setDoc(doc(db, "games", S.code, "secret", "key"), { authors: { [String(qi)]: entries.map(e => e.uid) } }, { merge: true });
        const span = MODES.funny.voteSeconds * 1000;
        await updateDoc(gameRef(S.code), { status: "vote", voteOptions: entries.map(e => e.pick), closing: false, span, deadline: Date.now() + span });
        return;
      }
      reveal = { answer: entries.length ? "Only one answer, no vote this time" : "Nobody wrote anything!", funny: entries.map(e => ({ text: e.pick, by: e.uid, votes: 0 })), points, picks };
    } else if (q.kind === "funny") {
      const authors = (await getDoc(doc(db, "games", S.code, "secret", "key"))).data().authors[String(qi)];
      const votes = g.voteOptions.map(() => 0);
      ans.forEach(a => { const i = +a.pick; if (authors[i] && authors[i] !== a.uid) votes[i]++; });
      authors.forEach((uid, i) => { if (votes[i]) points[uid] = (points[uid] || 0) + votes[i] * POINTS; });
      const best = Math.max(...votes);
      reveal = { answer: best ? "Funniest answer" : "No votes", funny: g.voteOptions.map((text, i) => ({ text, by: authors[i], votes: votes[i], best: best > 0 && votes[i] === best })), points, picks: {} };
    } else if (q.kind === "vote") {
      const counts = {};
      ans.forEach(a => { counts[a.pick] = (counts[a.pick] || 0) + 1; });
      const top = Math.max(0, ...Object.values(counts));
      const winners = Object.keys(counts).filter(k => counts[k] === top);
      ans.forEach(a => { if (top > 0 && winners.includes(a.pick)) points[a.uid] = POINTS; });
      reveal = { answer: winners.map(w => q.who ? playerName(w) : w).join(" & ") || "Nobody voted", counts, winners, points, picks };
    } else {
      const answers = (await getDoc(doc(db, "games", S.code, "secret", "key"))).data().answers[String(qi)];
      const ok = q.kind === "text" ? p => answers.some(k => close(norm(p), norm(k))) : p => p === answers[0];
      let rank = 0;
      ans.forEach(a => {
        if (!ok(a.pick)) return;
        points[a.uid] = POINTS + (g.mode === "tf" ? (SPEED_BONUS[rank] || 0) : 0);
        rank++;
      });
      reveal = { answer: answers[0], points, picks };
    }
    const batch = writeBatch(db);
    Object.entries(points).forEach(([id, pts]) => {
      if (S.players.some(p => p.id === id)) batch.update(doc(db, "games", S.code, "players", id), { score: increment(pts), correct: increment(1) });
    });
    batch.update(gameRef(S.code), { status: "reveal", reveal });
    await batch.commit();
  } finally { S.busy = false; }
}

function saveProfile() {
  const n = document.getElementById("name");
  if (n) S.name = n.value.trim().slice(0, 20);
  if (!S.name) { S.error = "Type your name first."; render(); return false; }
  store.set("ffc-name", S.name); store.set("ffc-avatar", S.avatar);
  return true;
}

function leave() {
  S.unsub.forEach(u => u()); S.unsub = []; clearInterval(S.tick);
  S.game = null; S.players = []; S.code = "";
  history.replaceState(null, "", location.pathname);
  render();
}

// ---------- Views ----------
function ranked() {
  return S.players.slice().sort((a, b) => (b.score || 0) - (a.score || 0) || (b.correct || 0) - (a.correct || 0));
}
function board(showAnswered) {
  const g = S.game;
  return `<div class="list">${ranked().map((p, i) => {
    const done = showAnswered && p.answer?.k === phaseKey(g);
    return `
    <div class="p ${p.id === S.uid ? "first" : ""}">
      <span class="rank">${i + 1}</span><span class="av" aria-hidden="true">${esc(p.avatar)}</span>
      <span class="nm">${esc(p.name)}${p.id === S.uid ? " (you)" : ""}${p.id === g.hostUid ? ' <span class="tag">host</span>' : ""}</span>
      ${showAnswered ? `<span class="tag ${done ? "done" : ""}">${done ? "answered" : "thinking…"}</span>` : `<span class="pts">${p.score || 0}</span>`}
    </div>`;
  }).join("")}</div>`;
}
const who = ids => ids.map(id => S.players.find(p => p.id === id)).filter(Boolean)
  .map(p => `<span class="chooser" title="${esc(p.name)}">${esc(p.avatar)} ${esc(p.name)}</span>`).join("");

function seg(act, key, values, current) {
  return `<div class="seg" role="group">${Object.entries(values).map(([k, label]) =>
    `<button type="button" data-act="${act}" data-${key}="${k}" aria-pressed="${current === k}">${label}</button>`).join("")}</div>`;
}

function viewStart() {
  const topicChips = ["mixed", ...Object.keys(QUIZ)].map(t => `<button type="button" class="chip" data-act="topic" data-topic="${t}" aria-pressed="${S.topic === t}">
    <span class="e" aria-hidden="true">${t === "mixed" ? "🎲" : QUIZ[t].icon}</span>${t === "mixed" ? "All topics" : QUIZ[t].name}</button>`).join("");
  return `
    <header class="brand"><div class="mark" aria-hidden="true">🎉</div>
      <div><h1>FamilyFun Club</h1><p>Live family games. Everyone plays on their own phone.</p></div></header>
    <section class="panel">
      <h2>Who are you?</h2>
      <input type="text" id="name" maxlength="20" placeholder="Your name, e.g. Dadi or Riya" value="${esc(S.name)}" aria-label="Your name">
      <div class="avatars" role="group" aria-label="Pick an avatar">
        ${AVATARS.map(a => `<button type="button" data-act="avatar" data-av="${a}" aria-pressed="${a === S.avatar}" aria-label="Avatar ${a}">${a}</button>`).join("")}
      </div>
      ${S.error ? `<p class="err" role="alert">${esc(S.error)}</p>` : ""}
    </section>
    <section class="panel">
      <h2>Join a game</h2>
      <div class="row">
        <input type="text" id="code" class="code" maxlength="4" placeholder="CODE" value="${esc(S.code)}" aria-label="Game code" autocomplete="off">
        <button class="btn" data-act="join">Join</button>
      </div>
    </section>
    <section class="panel">
      <h2>Or host a new game</h2>
      <div class="modes">${Object.entries(MODES).map(([k, m]) => `
        <button type="button" class="mode" data-act="mode" data-mode="${k}" aria-pressed="${S.mode === k}">
          <span class="e" aria-hidden="true">${m.icon}</span><span><strong>${m.name}</strong><br><span class="note">${m.blurb}</span></span>
        </button>`).join("")}</div>
      ${S.mode === "guess" ? `<div class="label">Category</div>
      <div class="chips">${CATS.map(c => `<button type="button" class="chip" data-act="cat" data-cat="${c}" aria-pressed="${S.cat === c}">
        <span class="e" aria-hidden="true">${c === "mixed" ? "🎲" : BANK[c].icon}</span>${c === "mixed" ? "Mix of all" : BANK[c].name}</button>`).join("")}</div>` : ""}
      ${S.mode === "quiz" ? `<div class="label">Topic</div><div class="chips">${topicChips}</div>
      <div class="label">Level</div>${seg("level", "level", LEVELS, S.level)}` : ""}
      <div class="label">Number of questions</div>
      ${seg("count", "n", { 5: "5", 10: "10", 15: "15" }, String(S.count))}
      <button class="btn wide" data-act="host">Host game</button>
      <p class="note">${MODES[S.mode].seconds} seconds per question. You can change your answer until time runs out.</p>
    </section>`;
}

function viewLobby() {
  const g = S.game, m = MODES[g.mode];
  const link = location.origin + location.pathname + "?game=" + S.code;
  const wa = "https://wa.me/?text=" + encodeURIComponent(`Join our FamilyFun Club game! Code ${S.code}: ${link}`);
  const minPlayers = ["likely", "funny"].includes(g.mode) ? 2 : 1;
  const canStart = S.players.length >= minPlayers;
  const detail = g.mode === "quiz" ? ` · ${g.topic === "mixed" ? "All topics" : QUIZ[g.topic].name} · ${LEVELS[g.level]}` : "";
  return `
    <section class="panel center">
      <p class="label">${m.icon} ${m.name}${esc(detail)}</p>
      <div class="bigcode">${esc(S.code)}</div>
      <p class="note">Family members open the link, type their name and join.</p>
      <div class="row" style="justify-content:center">
        <a class="btn" href="${wa}" target="_blank" rel="noopener">Share on WhatsApp</a>
        <button class="btn ghost" data-act="copy" data-link="${esc(link)}">Copy link</button>
      </div>
    </section>
    <section class="panel">
      <h2>${S.players.length} ${S.players.length === 1 ? "player" : "players"} here</h2>
      ${board(false)}
      ${isHost()
        ? `<button class="btn wide" data-act="start" ${canStart ? "" : "disabled"}>Start game</button>
           ${canStart ? "" : `<p class="note center">This game needs at least ${minPlayers} players.</p>`}`
        : `<p class="note center">Waiting for the host to start…</p>`}
      <button class="btn ghost" data-act="leave">Leave game</button>
    </section>`;
}

function viewQuestion() {
  const g = S.game, q = g.questions[g.qIndex], rv = g.status === "reveal" ? g.reveal : null;
  const open = !rv && Date.now() < g.deadline;
  const mine = rv ? (rv.picks?.[S.uid] ?? null) : answerOf(me(), g);
  let body;

  if (q.kind === "funny" && g.status === "vote") {
    const own = S.ownFunny?.q === g.qIndex ? S.ownFunny.text : null;
    body = `<p class="label">Vote for the funniest (not your own)</p><div class="options">${g.voteOptions.map((t, i) => {
      const cls = "opt" + (mine === String(i) ? " picked" : "");
      const isOwn = t === own;
      return `<button class="${cls}" data-act="pick" data-opt="${i}" ${open && !isOwn ? "" : "disabled"}><span>${esc(t)}${isOwn ? '<br><span class="note">your answer</span>' : ""}</span></button>`;
    }).join("")}</div>`;
  } else if (q.kind === "funny" && rv) {
    body = `<div class="options">${(rv.funny || []).slice().sort((a, b) => b.votes - a.votes).map(f => `
      <div class="opt ${f.best ? "right" : ""}"><span>${esc(f.text)}<br><span class="note">by ${esc(playerName(f.by))}</span></span>
      <span class="votes">${f.best ? "🏆 " : ""}${f.votes} ${f.votes === 1 ? "vote" : "votes"}</span></div>`).join("")}</div>`;
  } else if (q.kind === "text" || q.kind === "funny") {
    if (rv) {
      body = `<div class="list">${S.players.map(p => `<div class="p"><span class="av" aria-hidden="true">${esc(p.avatar)}</span>
          <span class="nm">${esc(p.name)}<br><span class="note">${rv.picks?.[p.id] ? esc(rv.picks[p.id]) : "no answer"}</span></span>
          <span class="tag ${rv.points?.[p.id] ? "done" : ""}">${rv.points?.[p.id] ? "✓ +" + rv.points[p.id] : "✗"}</span></div>`).join("")}</div>`;
    } else if (mine && !S.editing) {
      body = `<p class="center"><strong>Your answer:</strong> ${esc(mine)}</p>
        ${open ? `<button class="btn ghost" data-act="edit">Change my answer</button>` : ""}`;
    } else {
      body = `<form id="typed" class="row" autocomplete="off"><input type="text" id="typedAnswer" maxlength="${q.kind === "funny" ? 80 : 40}" placeholder="${q.kind === "funny" ? "Make them laugh…" : "Your answer"}" aria-label="Your answer" value="${esc(mine || "")}">
          <button class="btn" type="submit" ${open ? "" : "disabled"}>Send</button></form>`;
    }
  } else {
    const total = rv?.counts ? Object.values(rv.counts).reduce((a, b) => a + b, 0) : 0;
    const choosers = {};
    if (rv) Object.entries(rv.picks || {}).forEach(([uid, p]) => (choosers[p] = choosers[p] || []).push(uid));
    body = `<div class="options">${q.options.map(o => {
      const label = q.who ? (S.players.find(p => p.id === o) ? `${S.players.find(p => p.id === o).avatar} ${playerName(o)}` : "Someone who left") : o;
      let cls = "opt";
      if (rv) {
        if (q.kind === "vote" ? rv.winners?.includes(o) : o === rv.answer) cls += " right";
        else if (o === mine) cls += " wrong";
      } else if (o === mine) cls += " picked";
      const votes = rv?.counts ? (rv.counts[o] || 0) : null;
      const fill = votes != null && total ? Math.round(100 * votes / total) : 0;
      return `<button class="${cls}" data-act="pick" data-opt="${esc(o)}" ${rv || !open ? "disabled" : ""}
        ${votes != null ? `style="background-image:linear-gradient(90deg, var(--vote) ${fill}%, transparent ${fill}%)"` : ""}>
        <span>${esc(label)}${rv && choosers[o] ? `<br><span class="choosers">${who(choosers[o])}</span>` : ""}</span>${votes != null ? `<span class="votes">${votes} ${votes === 1 ? "vote" : "votes"}</span>` : ""}</button>`;
    }).join("")}</div>`;
  }

  let foot;
  if (rv) {
    const got = rv.points?.[S.uid] || 0;
    const msg = q.kind === "funny"
      ? (got ? `Your answer got ${got / POINTS} ${got === POINTS ? "vote" : "votes"}! +${got}` : "No votes for you this time.")
      : q.kind === "vote"
      ? (got ? `You agreed with the family! +${got}` : `The family picked ${esc(rv.answer)}.`)
      : got ? `Correct! +${got}` : mine ? `Not quite. It was ${esc(rv.answer)}.` : `Time's up. It was ${esc(rv.answer)}.`;
    foot = `<p class="feedback ${got ? "ok" : "no"}" role="status">${msg}</p>
      ${board(false)}
      ${isHost() ? `<button class="btn wide" data-act="next">${g.qIndex + 1 >= g.total ? "See the winner" : "Next question"}</button>` : `<p class="note center">Waiting for the host…</p>`}`;
  } else {
    const status = g.closing ? "Everyone has answered. Closing in a moment…" : mine ? "Locked in. You can still change your answer until time runs out." : "";
    foot = `${status ? `<p class="note center">${status}</p>` : ""}${board(true)}`;
  }
  return `
    <section class="panel">
      <div class="progress"><span>${q.icon} ${esc(q.label)}</span><span>Question ${g.qIndex + 1} of ${g.total}</span></div>
      ${rv ? "" : `<div class="timer" aria-hidden="true"><div id="bar" style="width:100%"></div></div>`}
      <div class="clue"><div class="${q.text ? "text" : "emoji"}">${esc(q.clue)}</div><div class="ask">${g.status === "vote" ? "Voting time!" : esc(q.ask)}</div></div>
      ${body}
      ${foot}
    </section>`;
}

function viewDone() {
  const r = ranked(), top = r[0];
  const winners = top ? r.filter(p => (p.score || 0) === (top.score || 0) && (p.correct || 0) === (top.correct || 0)) : [];
  const title = winners.length > 1 ? `Tie between ${winners.map(w => esc(w.name)).join(" and ")}!` : top ? `${esc(top.name)} wins!` : "Game over";
  return `
    <section class="panel winner center">
      <div class="big" aria-hidden="true">${winners.length > 1 ? "🤝" : esc(top?.avatar || "🎉")}</div>
      <h1>${title}</h1>
      <p class="note">Most points wins. Same points? Most correct answers. Still tied, you share the crown.</p>
    </section>
    <section class="panel">${board(false)}
      <button class="btn wide" data-act="leave">Back to start</button></section>`;
}

let lastOpen = null;
function render() {
  if (!S.uid) { app.innerHTML = `<p class="note">Connecting…</p>`; return; }
  const ids = ["name", "code", "typedAnswer"];
  const vals = Object.fromEntries(ids.map(id => [id, document.getElementById(id)?.value]));
  const active = document.activeElement?.id;
  const g = S.game;
  app.innerHTML = !g ? viewStart()
    : g.status === "lobby" ? viewLobby()
    : g.status === "done" ? viewDone()
    : viewQuestion();
  ids.forEach(id => { const el = document.getElementById(id); if (el && vals[id] != null) el.value = vals[id]; });
  if (active && document.getElementById(active)) document.getElementById(active).focus();
  lastOpen = g && ["question", "vote"].includes(g.status) ? Date.now() < g.deadline : null;
  updateTimer();
}

function updateTimer() {
  const bar = document.getElementById("bar"), g = S.game;
  if (!g) return;
  if (lastOpen && Date.now() >= g.deadline) render();   // lock the buttons the moment time runs out
  if (!bar) return;
  const left = Math.max(0, g.deadline - Date.now());
  bar.style.width = (100 * Math.min(1, left / (g.span || 1))) + "%";
}

app.addEventListener("submit", e => {
  if (e.target.id !== "typed") return;
  e.preventDefault();
  pick(document.getElementById("typedAnswer").value).catch(err => console.warn(err));
});

app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const keepName = () => { const n = document.getElementById("name"); if (n) S.name = n.value; };
  try {
    switch (b.dataset.act) {
      case "avatar": keepName(); S.avatar = b.dataset.av; render(); break;
      case "mode": keepName(); S.mode = b.dataset.mode; store.set("ffc-mode", S.mode); render(); break;
      case "cat": keepName(); S.cat = b.dataset.cat; store.set("ffc-cat", S.cat); render(); break;
      case "topic": keepName(); S.topic = b.dataset.topic; store.set("ffc-topic", S.topic); render(); break;
      case "level": keepName(); S.level = b.dataset.level; store.set("ffc-level", S.level); render(); break;
      case "count": keepName(); S.count = +b.dataset.n; store.set("ffc-count", S.count); render(); break;
      case "host": b.disabled = true; await hostGame(); break;
      case "join": b.disabled = true; await joinGame(document.getElementById("code").value); break;
      case "start": b.disabled = true; await startGame(); break;
      case "next": b.disabled = true; await startNext(); break;
      case "edit": S.editing = true; render(); document.getElementById("typedAnswer")?.focus(); break;
      case "pick": await pick(b.dataset.opt); break;
      case "leave": leave(); break;
      case "copy":
        try { await navigator.clipboard.writeText(b.dataset.link); b.textContent = "Copied!"; }
        catch (err) { b.textContent = b.dataset.link; }
        break;
    }
  } catch (err) {
    if (S.game) { console.warn(err); return; }
    S.error = "Something went wrong: " + err.message; render();
  }
});
</script>
</body>
</html>
